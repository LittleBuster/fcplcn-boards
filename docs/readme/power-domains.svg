<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1435" viewBox="0 0 1600 1435" role="img" aria-labelledby="title desc"><title id="title">Питание и домены земли FCPLCn</title><desc id="desc">12 В после защиты питают реле и ветку логики. Три преобразователя питают CPU, общие 5 В и RS485. От 5 В питаются нижние 3,3 В и изолированный TMR. TMR питает DATA, контакт питания RS485 и преобразователь внешней I2C. Полевые порты имеют общую GND_ISO.</desc><rect width="1600" height="1435" rx="0" fill="#0c1522"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="62" font-size="20" fill="#8ab9ff" font-weight="700" text-anchor="start">FCPLCn / ПИТАНИЕ</text><text x="60" y="115" font-size="40" fill="#edf3fc" font-weight="700" text-anchor="start">От 12 В до полевых портов</text><text x="60" y="153" font-size="22" fill="#adbed3" font-weight="400" text-anchor="start">Источники питания двух плат и граница общей GND_ISO</text><rect x="525" y="785" width="1050" height="455" rx="24" fill="#102826" stroke="#88ddba" stroke-opacity=".6" stroke-dasharray="8 8"/><path d="M460 285 H560" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M540 278L552 285L540 292Z" fill="#f4ce86"/><path d="M510 285 V185 H1315" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M1315 185 V215" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M1308 195L1315 207L1322 195Z" fill="#f4ce86"/><path d="M770 355 V430 M260 430 H1315" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M260 430 V480" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M253 460L260 472L267 460Z" fill="#f4ce86"/><path d="M770 430 V480" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M763 460L770 472L777 460Z" fill="#f4ce86"/><path d="M1315 430 V480" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M1308 460L1315 472L1322 460Z" fill="#f4ce86"/><path d="M770 640 V750 H260" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M260 750 V835" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M253 815L260 827L267 815Z" fill="#f4ce86"/><path d="M770 750 V785" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M770 785 V835" fill="none" stroke="#88ddba" stroke-width="3"/><path d="M763 815L770 827L777 815Z" fill="#88ddba"/><path d="M980 907 H1090" fill="none" stroke="#88ddba" stroke-width="3"/><path d="M1070 900L1082 907L1070 914Z" fill="#88ddba"/><path d="M770 980 V1070" fill="none" stroke="#88ddba" stroke-width="3"/><path d="M763 1050L770 1062L777 1050Z" fill="#88ddba"/><path d="M980 1142 H1090" fill="none" stroke="#88ddba" stroke-width="3"/><path d="M1070 1135L1082 1142L1070 1149Z" fill="#88ddba"/><rect x="60" y="215" width="400" height="140" rx="20" fill="#152235" stroke="#f4ce86" stroke-opacity=".6"/>
<text x="84" y="257" font-size="25" fill="#f4ce86" font-weight="700" text-anchor="start">12 В DC · RLY J1</text>
<text x="84" y="293" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">F1 1,5 А → D1 SS34</text>
<text x="84" y="321" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">+12V_SYS · TVS D2 SMBJ15A</text><rect x="560" y="215" width="420" height="140" rx="20" fill="#152235" stroke="#f4ce86" stroke-opacity=".6"/>
<text x="584" y="257" font-size="25" fill="#f4ce86" font-weight="700" text-anchor="start">Ветка логики</text>
<text x="584" y="293" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">D3 B340B + R12 1 Ом / 2 Вт</text>
<text x="584" y="321" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">+12V_LOGIC</text><rect x="1090" y="215" width="450" height="140" rx="20" fill="#152235" stroke="#f4ce86" stroke-opacity=".6"/>
<text x="1114" y="257" font-size="25" fill="#f4ce86" font-weight="700" text-anchor="start">Нагрузки 12 В</text>
<text x="1114" y="293" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Катушки K1…K16</text>
<text x="1114" y="321" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Входные цепи LED TLP2363</text><text x="60" y="405" font-size="22" fill="#f4ce86" font-weight="400" text-anchor="start">+12V_LOGIC → три источника</text><rect x="60" y="480" width="400" height="160" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="84" y="522" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">+3V3 · CPU U3</text>
<text x="84" y="558" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">R-78K3.3-1.0 · 1 А</text>
<text x="84" y="586" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">ESP32-S3, W5500 и RTC</text><rect x="560" y="480" width="420" height="160" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="584" y="522" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">MOD_VBUS · 5 В</text>
<text x="584" y="558" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">RLY U2 · R-78E5.0-1.0</text>
<text x="584" y="586" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Общий источник 5 В · 1 А</text><rect x="1090" y="480" width="450" height="160" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="1114" y="522" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">+3V3_RS485 · CPU U12</text>
<text x="1114" y="558" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">R-78K3.3-0.5 · 500 мА</text>
<text x="1114" y="586" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Основная сторона ADM2687E</text><text x="60" y="705" font-size="22" fill="#8ab9ff" font-weight="700" text-anchor="start">ОСНОВНАЯ GND</text><text x="60" y="737" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">CPU, реле, DI и память</text><text x="1090" y="705" font-size="22" fill="#8ab9ff" font-weight="700" text-anchor="start">isoPower ADM2687E</text><text x="1090" y="737" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Питает сам трансивер, не порт J8</text><rect x="60" y="835" width="400" height="145" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="84" y="877" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">3,3 В · RLY U8</text>
<text x="84" y="913" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">TLV1117LV33</text>
<text x="84" y="941" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">MCP23017 и FRAM</text><text x="1090" y="814" font-size="20" fill="#88ddba" font-weight="700" text-anchor="start">ПОЛЕВОЙ ДОМЕН · GND_ISO</text><rect x="560" y="835" width="420" height="145" rx="20" fill="#152235" stroke="#88ddba" stroke-opacity=".6"/>
<text x="584" y="877" font-size="25" fill="#88ddba" font-weight="700" text-anchor="start">5V_ISO · CPU U4</text>
<text x="584" y="913" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">TMR-1-0511 · 1 Вт / 200 мА</text>
<text x="584" y="941" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Изолированный источник 5 В</text><rect x="1090" y="835" width="450" height="145" rx="20" fill="#152235" stroke="#88ddba" stroke-opacity=".6"/>
<text x="1114" y="877" font-size="24" fill="#88ddba" font-weight="700" text-anchor="start">Питание внешних портов</text>
<text x="1114" y="913" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">DATA: J3, контакт 9</text>
<text x="1114" y="941" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">RS-485: J8, контакт 1</text><rect x="560" y="1070" width="420" height="145" rx="20" fill="#152235" stroke="#88ddba" stroke-opacity=".6"/>
<text x="584" y="1112" font-size="25" fill="#88ddba" font-weight="700" text-anchor="start">3V3_ISO · CPU U5</text>
<text x="584" y="1148" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">R-78K3.3-0.5 · 500 мА</text>
<text x="584" y="1176" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Мощность ограничена TMR</text><rect x="1090" y="1070" width="450" height="145" rx="20" fill="#152235" stroke="#88ddba" stroke-opacity=".6"/>
<text x="1114" y="1112" font-size="25" fill="#88ddba" font-weight="700" text-anchor="start">Внешняя I²C · J5</text>
<text x="1114" y="1148" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Контакт 1: 3V3_ISO</text>
<text x="1114" y="1176" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">SDA / SCL: подтяжки к 3,3 В</text><text x="60" y="1300" font-size="24" fill="#88ddba" font-weight="700" text-anchor="start">DATA, внешняя I²C и RS-485 используют одну общую GND_ISO.</text><text x="60" y="1342" font-size="23" fill="#adbed3" font-weight="400" text-anchor="start">Внешние полевые устройства: 120 мА суммарно, с учётом обеих шин питания.</text><text x="60" y="1384" font-size="23" fill="#adbed3" font-weight="400" text-anchor="start">Основная GND и GND_ISO — разные домены; дискретные входы относятся к основной GND.</text></g></svg>
