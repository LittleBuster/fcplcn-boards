<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="830" viewBox="0 0 1600 830" role="img" aria-labelledby="title desc"><title id="title">Функциональная схема двух плат FCPLCn</title><desc id="desc">CPU соединяется с нижней платой по внутренней I2C и reset. Внешние DATA, I2C и RS485 имеют общую изолированную землю.</desc><rect width="1600" height="830" rx="28" fill="#0c1522"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="60" y="62" font-size="20" fill="#8ab9ff" font-weight="700" text-anchor="start">FCPLCn / FCPLCN-161608-1v0</text><text x="60" y="115" font-size="40" fill="#edf3fc" font-weight="700" text-anchor="start">Две платы. Один автономный PLC.</text><text x="60" y="150" font-size="21" fill="#adbed3" font-weight="400" text-anchor="start">Функциональные связи • 16 реле · 16 входов · 8 DATA-линий</text><path d="M360 267 H450" fill="none" stroke="#8ab9ff" stroke-width="3"/><path d="M430 260L442 267L430 274Z" fill="#8ab9ff"/><path d="M380 260L368 267L380 274Z" fill="#8ab9ff"/><path d="M700 350 V490" fill="none" stroke="#8ab9ff" stroke-width="3"/><path d="M693 470L700 482L707 470Z" fill="#8ab9ff"/><path d="M693 370L700 358L707 370Z" fill="#8ab9ff"/><path d="M360 588 H450" fill="none" stroke="#f4ce86" stroke-width="3"/><path d="M430 581L442 588L430 595Z" fill="#f4ce86"/><path d="M950 267 H1080" fill="none" stroke="#88ddba" stroke-width="3"/><path d="M1060 260L1072 267L1060 274Z" fill="#88ddba"/><path d="M970 260L958 267L970 274Z" fill="#88ddba"/><rect x="60" y="205" width="300" height="125" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="84" y="247" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">Домашняя сеть</text>
<text x="84" y="283" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Ethernet / Wi-Fi</text>
<text x="84" y="311" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">MQTT → Linux-хаб</text><rect x="450" y="205" width="500" height="145" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="474" y="247" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">FCPLCN-CPU-08-1v0</text>
<text x="474" y="283" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">ESP32-S3 N16R8 · W5500</text>
<text x="474" y="311" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">RTC DS3231MZ+ · 0x68</text><text x="724" y="405" font-size="22" fill="#8ab9ff" font-weight="400" text-anchor="start">I²C · GPIO4/5</text><text x="724" y="438" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">MCP RESET · GPIO6</text><rect x="450" y="490" width="500" height="190" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="474" y="532" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">FCPLCN-RLY-1616-1v0</text>
<text x="474" y="568" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">MCP23017 · 0x20 / 0x21</text>
<text x="474" y="596" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">16 реле COM/NO · 16 входов DI</text>
<text x="474" y="624" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">FRAM 8 КиБ · 0x50</text><rect x="60" y="525" width="300" height="125" rx="20" fill="#152235" stroke="#f4ce86" stroke-opacity=".6"/>
<text x="84" y="567" font-size="25" fill="#f4ce86" font-weight="700" text-anchor="start">Питание 12 В DC</text>
<text x="84" y="603" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Вход J1 нижней платы</text>
<text x="84" y="631" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Питание обеих плат</text><rect x="1080" y="205" width="460" height="300" rx="20" fill="#152235" stroke="#88ddba" stroke-opacity=".6"/>
<text x="1104" y="247" font-size="25" fill="#88ddba" font-weight="700" text-anchor="start">Полевая сторона</text>
<text x="1104" y="283" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">DATA1…8 · питание 5V_ISO</text>
<text x="1104" y="311" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">I²C · питание 3V3_ISO</text>
<text x="1104" y="339" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">RS-485 · A / B / GND_ISO</text>
<text x="1104" y="367" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start"></text>
<text x="1104" y="395" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Общая земля GND_ISO</text><text x="1016" y="320" font-size="18" fill="#88ddba" font-weight="400" text-anchor="middle">Барьер</text><text x="1080" y="550" font-size="24" fill="#88ddba" font-weight="700" text-anchor="start">ISO1640 / ADM2687E</text><text x="1080" y="587" font-size="21" fill="#adbed3" font-weight="400" text-anchor="start">DATA, I²C и RS-485 разделяют</text><text x="1080" y="618" font-size="21" fill="#adbed3" font-weight="400" text-anchor="start">одну GND_ISO; это один домен.</text><text x="60" y="745" font-size="23" fill="#adbed3" font-weight="400" text-anchor="start">Основная GND: CPU, расширители, FRAM и дискретные входы.</text><text x="60" y="785" font-size="23" fill="#adbed3" font-weight="400" text-anchor="start">К облаку подключается Linux-хаб; PLC сохраняет локальную логику управления.</text></g></svg>
