<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="550" viewBox="0 0 1600 550" role="img" aria-labelledby="title desc"><title id="title">Функциональная схема дискретного входа FCPLCn</title><desc id="desc">Цепочка сухой контакт, входной RC, TLP2363, выходной RC, MCP23017. Земля общая; замыкание соответствует LOW.</desc><rect width="1600" height="550" rx="28" fill="#0c1522"/><g font-family="Inter,Segoe UI,Arial,sans-serif"><text x="50" y="62" font-size="20" fill="#8ab9ff" font-weight="700" text-anchor="start">FCPLCn / ДИСКРЕТНЫЕ ВХОДЫ</text><text x="50" y="115" font-size="39" fill="#edf3fc" font-weight="700" text-anchor="start">Сухой контакт → цифровой уровень</text><text x="50" y="153" font-size="22" fill="#adbed3" font-weight="400" text-anchor="start">Канал 1 из 16 · установившиеся состояния · функциональная схема</text><path d="M295 266 H355" fill="none" stroke="#8ab9ff" stroke-width="3"/><path d="M335 259L347 266L335 273Z" fill="#8ab9ff"/><path d="M600 266 H660" fill="none" stroke="#8ab9ff" stroke-width="3"/><path d="M640 259L652 266L640 273Z" fill="#8ab9ff"/><path d="M905 266 H965" fill="none" stroke="#8ab9ff" stroke-width="3"/><path d="M945 259L957 266L945 273Z" fill="#8ab9ff"/><path d="M1210 266 H1270" fill="none" stroke="#8ab9ff" stroke-width="3"/><path d="M1250 259L1262 266L1250 273Z" fill="#8ab9ff"/><rect x="50" y="195" width="245" height="155" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="74" y="237" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">Контакт</text>
<text x="74" y="273" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">DI1 ↔ GND</text>
<text x="74" y="301" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Замкнут / разомкнут</text><rect x="355" y="195" width="245" height="155" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="379" y="237" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">Входной RC</text>
<text x="379" y="273" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">R161 · 220 Ом</text>
<text x="379" y="301" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">C141 · 1 мкФ</text><rect x="660" y="195" width="245" height="155" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="684" y="237" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">TLP2363</text>
<text x="684" y="273" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Цепь LED: 12 В</text>
<text x="684" y="301" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">R101 · 1,2 кОм</text>
<text x="684" y="329" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">Шунт: 4,7 кОм</text><rect x="965" y="195" width="245" height="155" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="989" y="237" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">Выходной RC</text>
<text x="989" y="273" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">R141 · 470 Ом</text>
<text x="989" y="301" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">C101 · 100 нФ</text><rect x="1270" y="195" width="280" height="155" rx="20" fill="#152235" stroke="#8ab9ff" stroke-opacity=".6"/>
<text x="1294" y="237" font-size="25" fill="#8ab9ff" font-weight="700" text-anchor="start">MCP23017</text>
<text x="1294" y="273" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">U5 · адрес 0x20</text>
<text x="1294" y="301" font-size="20" fill="#adbed3" font-weight="400" text-anchor="start">IN1 → GPB0</text><text x="50" y="410" font-size="28" fill="#88ddba" font-weight="700" text-anchor="start">Контакт замкнут → LOW</text><text x="820" y="410" font-size="28" fill="#8ab9ff" font-weight="700" text-anchor="start">Контакт разомкнут → HIGH</text><text x="50" y="464" font-size="23" fill="#adbed3" font-weight="400" text-anchor="start">DI, TLP2363 и MCP23017 используют общую GND. DI — вход для сухого контакта.</text><text x="50" y="505" font-size="22" fill="#adbed3" font-weight="400" text-anchor="start">TVS и обратный диод показаны в полной принципиальной схеме нижней платы.</text></g></svg>
